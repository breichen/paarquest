# Hält das kostenlose Supabase-Projekt dcmyhjbhcifevisbhjav aktiv: Supabase pausiert
# Free-Projekte nach rund einer Woche ohne Aktivität. Einmal täglich wird
# keepalive_ping() aufgerufen, das eine Zeitangabe in die Tabelle keepalive_log
# schreibt (Schreibzugriff zählt sicher als Aktivität). Einrichtung: einmal
# supabase/keepalive_ping.sql im SQL-Editor ausführen.
#
# Benötigtes Secret (Settings -> Secrets and variables -> Actions):
#   SUPABASE_ANON_KEY = der öffentliche anon-Key aus lib/config.dart
#   (NICHT der service_role-Key)
name: Supabase wach halten
on:
  schedule:
    - cron: "29 6 * * *"   # täglich, Uhrzeit in UTC
  workflow_dispatch:         # zum Testen: Actions -> Run workflow

jobs:
  ping:
    runs-on: ubuntu-latest
    steps:
      - name: keepalive_ping() aufrufen
        env:
          KEY: ${{ secrets.SUPABASE_ANON_KEY }}
        run: |
          if [ -z "$KEY" ]; then echo "Secret SUPABASE_ANON_KEY fehlt"; exit 1; fi
          curl -fsS --retry 3 --retry-delay 10 -X POST \
            "https://dcmyhjbhcifevisbhjav.supabase.co/rest/v1/rpc/keepalive_ping" \
            -H "apikey: $KEY" -H "Authorization: Bearer $KEY" \
            -H "Content-Type: application/json" -d '{}'
          echo
          echo "OK"
