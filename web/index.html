<!DOCTYPE html>
<html lang="de">
<head>
  <base href="$FLUTTER_BASE_HREF">
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="robots" content="noindex, nofollow">
  <meta name="description" content="PaarQuest – private App">
  <meta name="theme-color" content="#5B2A4E">

  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="default">
  <meta name="apple-mobile-web-app-title" content="PaarQuest">
  <link rel="apple-touch-icon" href="icons/Icon-192.png">
  <link rel="icon" type="image/png" href="favicon.png">

  <title>PaarQuest</title>
  <!-- use-credentials: nötig, damit das Manifest hinter Cloudflare Access geladen wird -->
  <link rel="manifest" href="manifest.json" crossorigin="use-credentials">
  <style>
    html, body { margin: 0; height: 100%; background: #F4F2F7; }
    #loading { position: fixed; inset: 0; display: flex; align-items: center; justify-content: center; transition: opacity .3s; }
    #loading img { width: 96px; height: 96px; border-radius: 22px; animation: pulse 1.4s ease-in-out infinite; }
    @keyframes pulse { 50% { transform: scale(.92); opacity: .75; } }
  </style>
</head>
<body>
  <div id="loading"><img src="icons/Icon-192.png" alt=""></div>
  <script>
    window.addEventListener('flutter-first-frame', function () {
      var l = document.getElementById('loading');
      if (l) { l.style.opacity = '0'; setTimeout(function () { l.remove(); }, 350); }
    });
  </script>
  <!-- Web-Push: push_config.js zuerst (Firebase-Werte), dann die Brücke für Dart -->
  <script src="push_config.js"></script>
  <script src="push.js"></script>
  <script src="flutter_bootstrap.js" async></script>
</body>
</html>
